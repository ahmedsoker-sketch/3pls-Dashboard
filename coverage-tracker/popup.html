<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Assign Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Talabat Brand Variables ── */
:root {
  --bg: #F4EDE3;
  --surface: #ffffff;
  --border: #e8ddd3;
  --border-strong: #d4c4b4;
  --text-primary: #1a0f0a;
  --text-secondary: #6b5c52;
  --text-muted: #a09080;
  --accent: #FF5900;
  --accent-light: #fff2ec;
  --accent-text: #cc4400;
  --hdr: #411517;
  --hdr-text: #f4ede3;
  --lime: #CFFF00;
  --success-bg: #edf7ed;
  --success-text: #2d7a2d;
  --warn-bg: #fff8e6;
  --warn-text: #b07800;
  --danger-bg: #fef0f0;
  --danger-text: #c0392b;
  --radius: 10px;
  --shadow: 0 1px 4px rgba(65,21,23,.08);
}
[data-theme="dark"] {
  --bg: #2a0d0f;
  --surface: #3d1518;
  --border: #5a2020;
  --border-strong: #7a3030;
  --text-primary: #f4ede3;
  --text-secondary: #c4a090;
  --text-muted: #8a6a60;
  --accent: #FF5900;
  --accent-light: #3a1a08;
  --accent-text: #ff8040;
  --hdr: #1a0608;
  --hdr-text: #f4ede3;
  --success-bg: #152215;
  --success-text: #5ab85a;
  --warn-bg: #221a08;
  --warn-text: #f0b429;
  --danger-bg: #1e1010;
  --danger-text: #e07070;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Poppins', 'TT Commons Pro', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  width: 100%;
  min-height: 100vh;
  font-size: 13px;
}

/* ── Topbar ── */
.topbar {
  background: var(--hdr);
  padding: .55rem .75rem .45rem;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(65,21,23,.25);
}
.topbar-row1 {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.logo { display: flex; align-items: center; gap: 8px; }
.logo-mark {
  width: 28px; height: 28px;
  background: var(--accent);
  border-radius: 8px;
  transform: rotate(-4deg);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 800; color: #F4EDE3;
  font-family: 'Poppins', sans-serif;
  flex-shrink: 0;
}
.logo-text { font-weight: 700; font-size: 14px; color: #F4EDE3; letter-spacing: -.01em; }
.logo-sub  { font-size: 10px; color: rgba(244,237,227,.5); font-weight: 400; letter-spacing: .02em; display: block; line-height: 1.1; }
.topbar-actions { display: flex; gap: 5px; }
.icon-btn {
  background: rgba(244,237,227,.12);
  border: 1px solid rgba(244,237,227,.2);
  border-radius: var(--radius);
  padding: 4px 9px;
  font-size: 13px;
  color: rgba(244,237,227,.8);
  cursor: pointer;
  transition: all .15s;
}
.icon-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.token-bar { display: inline-block; padding: 3px 10px; border-radius: var(--radius); font-size: 11px; font-weight: 500; margin-bottom: 4px; }
.token-ok  { background: rgba(45,122,45,.3);  color: #a8ffb0; }
.token-err { background: rgba(192,57,43,.3); color: #ffb0b0; }
.status-bar { font-size: 11px; color: rgba(244,237,227,.5); }
.timer-bar  { font-size: 11px; color: #CFFF00; font-weight: 600; display: none; }
.gh-status  { font-size: 11px; min-height: 14px; margin-top: 2px; }

/* ── Accent bar ── */
.accent-bar { height: 3px; background: linear-gradient(90deg, var(--accent), #ff8c42, transparent); }

/* ── Main ── */
.main { padding: .75rem; }

/* ── View Toggle ── */
.view-toggle {
  display: flex; gap: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px;
  margin-bottom: .65rem;
}
.vtbtn {
  flex: 1; padding: 6px 10px; border: none;
  border-radius: 7px;
  font-family: 'Poppins', sans-serif;
  font-size: 12px; font-weight: 500;
  cursor: pointer;
  background: transparent; color: var(--text-secondary);
  transition: all .15s;
}
.vtbtn:hover { background: var(--bg); }
.vtbtn-active { background: var(--accent) !important; color: #fff !important; }

/* ── Settings Card ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: .65rem;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: .55rem .75rem;
  cursor: pointer;
  font-size: 12px; font-weight: 600;
  color: var(--text-secondary);
  user-select: none;
  transition: background .15s;
}
.card-header:hover { background: var(--bg); }
.card-arrow { font-size: 10px; color: var(--text-muted); transition: transform .2s; }
.card-body { display: none; padding: .75rem; border-top: 1px solid var(--border); }
.field { margin-bottom: .55rem; }
.field label { font-size: 11px; color: var(--text-secondary); display: block; margin-bottom: 3px; font-weight: 500; }
.field input {
  width: 100%; padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg); color: var(--text-primary);
  font-size: 11px; font-family: monospace;
  outline: none; transition: border-color .15s;
}
.field input:focus { border-color: var(--accent); }
.auto-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: .5rem; }
.auto-label { font-size: 12px; font-weight: 600; }
.auto-sub   { font-size: 10px; color: var(--text-muted); }
.toggle-switch { position: relative; display: inline-block; width: 34px; height: 20px; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; inset: 0; background: var(--border-strong); transition: .3s; border-radius: 20px; }
.slider:before { position: absolute; content: ''; height: 14px; width: 14px; left: 3px; bottom: 3px; background: #fff; transition: .3s; border-radius: 50%; }
input:checked + .slider { background: var(--accent); }
input:checked + .slider:before { transform: translateX(14px); }
.interval-row { display: flex; align-items: center; gap: 6px; margin-bottom: .6rem; flex-wrap: wrap; }
.interval-btn {
  padding: 3px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg); color: var(--text-secondary);
  font-size: 11px; font-weight: 500;
  cursor: pointer; transition: all .15s;
  font-family: 'Poppins', sans-serif;
}
 }
.interval-btn:hover { border-color: var(--accent); color: var(--accent); }
.save-btn {
  width: 100%; padding: 8px;
  background: var(--accent);
  border: none; border-radius: var(--radius);
  color: #fff; font-size: 12px; font-weight: 700;
  cursor: pointer; transition: opacity .15s;
  font-family: 'Poppins', sans-serif;
  letter-spacing: .01em;
}
.save-btn:hover { opacity: .88; }

/* ── Zone Overview Cards ── */
.zone-overview {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 10px;
}
.zov-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 10px;
  text-align: center;
  box-shadow: var(--shadow);
}
.zov-name { font-size: 9px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zov-nums { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
.zov-nums span { font-size: 10px; font-weight: 500; color: var(--text-secondary); }
.zov-pct  { display: inline-block; padding: 1px 7px; border-radius: 20px; font-size: 10px; font-weight: 700; }
.zov-hrs  { font-size: 9px; color: var(--text-secondary); margin-top: 3px; }
.pct-ok   { background: rgba(45,122,45,.15);  color: #2d7a2d; }
.pct-warn { background: rgba(176,120,0,.15);  color: #b07800; }
.pct-bad  { background: rgba(192,57,43,.15);  color: #c0392b; }

/* ── Zone Cards ── */
.zone-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: .6rem;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: box-shadow .15s;
}
.zone-card:hover { box-shadow: 0 2px 10px rgba(255,89,0,.12); }
.zone-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: .6rem .75rem;
  cursor: pointer; user-select: none;
  transition: background .15s;
}
.zone-header:hover { background: var(--bg); }
.zone-left  { display: flex; align-items: center; gap: 8px; }
.zone-arrow { font-size: 10px; color: var(--text-secondary); transition: transform .2s; }
.zone-name  { font-weight: 700; font-size: 13px; }
.zone-right { display: flex; gap: 10px; align-items: center; font-size: 12px; }
.zone-total { color: var(--text-secondary); font-weight: 500; }
.zone-body  { border-top: 1px solid var(--border); }

table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th {
  padding: 5px 10px;
  font-size: 10px; font-weight: 600;
  color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em;
  background: var(--bg); border-bottom: 1px solid var(--border);
  text-align: right;
}
thead th:not(:first-child) { text-align: center; }
tbody td { padding: 6px 10px; border-bottom: 1px solid var(--border); }
tbody td:not(:first-child) { text-align: center; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--bg); }

.pill { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; }

/* ── Delta ── */
.delta-up   { color: var(--success-text); font-size: 9px; font-weight: 700; vertical-align: super; }
.delta-down { color: var(--danger-text);  font-size: 9px; font-weight: 700; vertical-align: super; }

/* ── Copy button ── */
.copy-img-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 2px 7px;
  font-size: 12px;
  cursor: pointer;
  color: var(--text-muted);
  opacity: 0;
  transition: opacity .15s, border-color .15s;
  line-height: 1.4;
}
.zone-header:hover .copy-img-btn { opacity: 1; }
.copy-img-btn:hover { border-color: var(--accent); color: var(--accent); }

.empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--text-muted); font-size: 13px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row1">
    <div class="logo">
      <div class="logo-mark">t</div>
      <div>
        <div class="logo-text">Assign Tool</div>
        <span class="logo-sub">3PLs Assign Tracker</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="copy-all-btn" title="نسخ كل المناطق كصورة">📷</button>
      <button class="icon-btn" id="refresh-btn" title="تحديث">🔄</button>
      <button class="icon-btn" id="theme-btn" title="تغيير المظهر">🌙</button>
    </div>
  </div>
  <div id="token-bar" class="token-bar token-err">🔴 جاري التحقق...</div>
  <div id="timer-bar" class="timer-bar"></div>
  <div id="status-bar" class="status-bar">اضض�w 🔄 لبدء التحميل</div>
  <div id="gh-status" class="gh-status"></div>
</div>
<div class="accent-bar"></div>

<div class="main">

  <!-- Settings -->
  <div class="card">
    <div class="card-header" id="settings-toggle">
      <span>⚙️ الإعدادات</span>
      <span class="card-arrow" id="settings-arrow">▼</span>
    </div>
    <div class="card-body" id="settings-body">
      <div class="field">
        <label>HeadCount Sheet — CSV URL</label>
        <input type="text" id="hc-url" placeholder="https://docs.google.com/spreadsheets/d/.../pub?gid=...&output=csv">
      </div>
      <div class="field">
        <label>3PLS Target Sheet — CSV URL</label>
        <input type="text" id="tg-url" placeholder="https://docs.google.com/spreadsheets/d/.../pub?gid=...&output=csv">
      </div>
      <div class="field">
        <label>Apps Script Webhook <span style="color:var(--text-muted);font-weight:400">(اختياري)</span></label>
        <input type="text" id="wh-url" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
      <div class="field">
        <label>GitHub Token <span style="color:var(--text-muted);font-weight:400">(للداشبورد الخارجي)</span></label>
        <input type="password" id="github-token" placeholder="ghp_...">
      </div>
      <div class="auto-row">
        <div>
          <div class="auto-label">🔄 تحديث أوتوماتيكي</div>
          <div class="auto-sub">يسحب البيانات في الخلفية دورياً</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="auto-refresh-toggle">
          <span class="slider"></span>
        </label>
      </div>
      <div class="interval-row">
        <span style="font-size:11px;color:var(--text-secondary)">كل</span>
        <button class="interval-btn" data-val="30">30 دق</button>
        <button class="interval-btn" data-val="60">60 دق</button>
        <button class="interval-btn" data-val="90">90 دق</button>
      </div>
      <button class="save-btn" id="save-settings-btn">💾 حفظ الإعدادات</button>
    </div>
  </div>

  <!-- View Toggle -->
  <div class="view-toggle">
    <button class="vtbtn vtbtn-active" id="btn-zone-view">📍 بالمنطقة</button>
    <button class="vtbtn" id="btn-office-view">🏢 بالمكتب</button>
  </div>

  <!-- Zone Overview -->
  <div class="zone-overview" id="zone-overview"></div>

  <!-- Dashboard -->
  <div id="dashboard"></div>

</div>

<script src="popup.js"></script>
</body>
</html>
