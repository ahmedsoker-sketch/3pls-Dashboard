<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mohandiseen 3PLs-Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#FF5900;--hdr:#411517;--bg:#F4EDE3;--surf:#fff;
  --bdr:#e8ddd3;--bdr2:#d4c4b4;--text:#1a0f0a;--text2:#5a3f35;
  --muted:#9a8a82;--sh:0 2px 8px rgba(65,21,23,.1);--radius:10px;
  --success-bg:#edf7ed;--success-text:#2d7a2d;
  --warn-bg:#fff8e6;   --warn-text:#b07800;
  --danger-bg:#fef0f0; --danger-text:#c0392b;
}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px}

/* ── Header ── */
.hdr{background:var(--hdr);padding:12px 20px;display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#F4EDE3;font-size:14px;transform:rotate(-4deg);flex-shrink:0;font-family:'Poppins',sans-serif}
.hdr-wrap{display:flex;flex-direction:column}
.hdr-t{color:#fff;font-size:14px;font-weight:700}
.hdr-s{font-size:10px;color:rgba(244,237,227,.5);margin-top:1px}
.acc{height:3px;background:linear-gradient(90deg,var(--accent),#ff8c42,transparent)}

.wrap{max-width:720px;margin:0 auto;padding:16px}

/* ── Login Card ── */
.lcard{background:var(--surf);border-radius:12px;border:1px solid var(--bdr);box-shadow:var(--sh);padding:28px 24px;max-width:400px;margin:28px auto}
.lci{font-size:36px;text-align:center;margin-bottom:10px}
.lct{font-size:17px;font-weight:700;text-align:center;margin-bottom:3px}
.lcs{font-size:12px;color:var(--text2);text-align:center;margin-bottom:20px}
.slbl{font-size:11px;font-weight:600;color:var(--text2);display:block;margin-bottom:6px}
.olist{display:flex;flex-direction:column;gap:5px;max-height:220px;overflow-y:auto}
.oopt{padding:9px 14px;border:2px solid var(--bdr);border-radius:8px;cursor:pointer;font-family:'Poppins',sans-serif;font-size:13px;font-weight:500;background:var(--bg);color:var(--text);text-align:right;transition:all .15s;width:100%}
.oopt:hover{border-color:var(--accent);background:#fff7f4;color:var(--accent)}
#pass-step{display:none;margin-top:14px}
.selbdg{background:#fff7f4;border:1px solid var(--accent);border-radius:7px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.chgbtn{font-size:11px;color:var(--muted);background:none;border:none;cursor:pointer;font-family:'Poppins',sans-serif;padding:0}
.chgbtn:hover{color:var(--accent)}
.pinp{width:100%;padding:10px 14px;border:2px solid var(--bdr);border-radius:8px;font-size:18px;font-family:'Poppins',sans-serif;text-align:center;background:var(--bg);color:var(--text);outline:none;letter-spacing:4px;margin-bottom:12px}
.pinp:focus{border-color:var(--accent)}
.lbtn{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;letter-spacing:.01em}
.lbtn:hover{opacity:.88}
.lbtn:disabled{opacity:.5;cursor:not-allowed}
.errmsg{color:var(--danger-text);font-size:12px;margin-top:8px;text-align:center;min-height:16px}

/* ── App ── */
#app{display:none}
.ohdr{background:var(--hdr);border-radius:var(--radius);padding:14px 16px;color:#fff;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.oname{font-size:16px;font-weight:700}
.oupd{font-size:11px;opacity:.65;margin-top:2px}
.ohdr-btns{display:flex;gap:8px;align-items:center}
.logbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:7px;padding:5px 14px;font-family:'Poppins',sans-serif;font-size:12px;cursor:pointer;transition:opacity .15s}
.logbtn:hover{opacity:.8}
.reloadbtn{background:rgba(255,89,0,.25);border:1px solid rgba(255,89,0,.5);color:#ffb090;border-radius:7px;padding:5px 12px;font-family:'Poppins',sans-serif;font-size:12px;cursor:pointer;transition:all .15s}
.reloadbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Summary grid */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:16px}
.scard{background:var(--surf);border:1px solid var(--bdr);border-radius:8px;padding:12px;text-align:center;box-shadow:var(--sh)}
.szone{font-size:10px;font-weight:600;color:var(--text2);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snum{font-size:18px;font-weight:700;margin-bottom:3px}
.spct{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600}

/* Riders table */
.stit{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.frow{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.fbtn{padding:4px 14px;border:1px solid var(--bdr);border-radius:20px;font-family:'Poppins',sans-serif;font-size:11px;font-weight:500;background:var(--surf);color:var(--text);cursor:pointer;transition:all .15s}
.fbtn:hover{border-color:var(--accent);color:var(--accent)}
.fbtn.act{background:var(--accent);color:#fff;border-color:var(--accent)}
.sinp{width:100%;padding:8px 12px;border:1px solid var(--bdr);border-radius:7px;font-family:'Poppins',sans-serif;font-size:12px;background:var(--bg);color:var(--text);outline:none;margin-bottom:10px}
.sinp:focus{border-color:var(--accent)}
.cnt{font-size:11px;color:var(--muted);margin-bottom:6px}
.rtbl{width:100%;border-collapse:collapse;background:var(--surf);border-radius:var(--radius);overflow:hidden;box-shadow:var(--sh);border:1px solid var(--bdr)}
.rtbl th{padding:8px 12px;font-size:10px;font-weight:600;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--bdr);text-align:right;letter-spacing:.04em;text-transform:uppercase}
.rtbl td{padding:8px 12px;font-size:12px;border-top:1px solid var(--bdr);text-align:right}
.rtbl tr:hover td{background:rgba(255,89,0,.03)}
.bdg{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600}
.by{background:var(--success-bg);color:var(--success-text)}
.bn{background:var(--danger-bg);color:var(--danger-text)}
.nor{text-align:center;padding:20px;color:var(--muted);font-size:12px}
.ldg{text-align:center;padding:24px;color:var(--muted);font-size:12px}
/* Delta + clickable zone cards */
.delta-up{color:var(--success-text);font-size:9px;font-weight:700;vertical-align:super}
.delta-down{color:var(--danger-text);font-size:9px;font-weight:700;vertical-align:super}
.scard{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.scard:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(255,89,0,.12)}
.scard.zact{border-color:var(--accent);background:#fff7f4}
.scard.zact .sarrow{transform:rotate(180deg);color:var(--accent)}
.scard-tot{cursor:default!important}
.scard-tot:hover{border-color:var(--bdr)!important;box-shadow:var(--sh)!important;background:var(--surf)!important}
.sarrow{font-size:9px;color:var(--muted);display:block;margin-top:4px;transition:transform .2s,color .2s;line-height:1}

/* Day tabs */
.day-tabs{display:flex;gap:6px;margin-bottom:12px}
.day-tab{flex:1;padding:7px 6px;border:1px solid var(--bdr);border-radius:8px;background:var(--surf);color:var(--text2);font-family:'Poppins',sans-serif;font-size:11px;font-weight:500;cursor:pointer;text-align:center;line-height:1.3;transition:all .15s}
.day-tab:hover{border-color:var(--accent);color:var(--accent)}
.day-tab.act{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.day-tab .day-lbl{display:block;font-size:10px;opacity:.8;margin-top:1px}

/* Phone copy */
.ph-copy{color:var(--accent);cursor:pointer;font-size:12px;-webkit-tap-highlight-color:transparent}
.ph-copy:active{opacity:.6}

/* Toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:#222;color:#fff;padding:8px 20px;border-radius:24px;font-size:13px;opacity:0;transition:all .25s;z-index:999;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Mobile card view */
.rider-cards{display:none;flex-direction:column;gap:8px}
.rcard{background:var(--surf);border:1px solid var(--bdr);border-radius:10px;padding:12px 14px;box-shadow:var(--sh)}
.rcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.rcard-name{font-size:13px;font-weight:600;line-height:1.3;flex:1}
.rcard-id{font-size:10px;color:var(--muted);margin-top:2px}
.rcard-meta{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--text2)}
.rcard-meta span{display:flex;align-items:center;gap:3px}

@media(max-width:600px){
  .wrap{padding:10px}
  .rtbl{display:none}
  .rider-cards{display:flex}
  .sgrid{grid-template-columns:repeat(2,1fr)}
  .snum{font-size:16px}
  .ohdr{padding:10px 12px}
  .oname{font-size:14px}
  .frow{gap:4px}
  .fbtn{padding:4px 10px;font-size:10px}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">t</div>
  <div class="hdr-wrap">
    <div class="hdr-t">Mohandiseen 3PLs-Dashboard</div>
    <div class="hdr-s">3PLs Assign Tracker</div>
  </div>
</div>
<div class="acc"></div>
<div class="wrap">

<!-- Login -->
<div id="login">
  <div class="lcard">
    <div class="lci">🏢</div>
    <div class="lct">تسجيل الدخول</div>
    <div class="lcs">اختار مكتبك ثم أدخل الباسورد</div>
    <div id="office-step">
      <span class="slbl">① اختار المكتب</span>
      <div class="olist" id="olist"></div>
    </div>
    <div id="pass-step">
      <div class="selbdg">
        <span id="selname"></span>
        <button class="chgbtn" onclick="resetOff()">← تغيير</button>
      </div>
      <span class="slbl">② أدخل الباسورد</span>
      <input class="pinp" type="password" id="pinp" placeholder="••••••" autocomplete="off"
             onkeydown="if(event.key==='Enter')doLogin()">
      <button class="lbtn" id="lbtn" onclick="doLogin()">دخول</button>
      <div class="errmsg" id="errmsg"></div>
    </div>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="ohdr">
    <div>
      <div class="oname" id="aoff"></div>
      <div class="oupd"  id="aupd"></div>
    </div>
    <div class="ohdr-btns">
      <button class="reloadbtn" onclick="reloadData()">🔄 تحديث</button>
      <button class="logbtn"    onclick="doLogout()">← خروج</button>
    </div>
  </div>
  <div class="day-tabs" id="day-tabs"></div>
  <div class="sgrid" id="sgrid"></div>
  <div class="stit">👥 قائمة الطيارين</div>
  <input class="sinp" type="text" id="srch" placeholder="🔍 ابحث بالاسم أو الـ ID أو المنطقة..." oninput="renderTbl()">
  <div class="frow" id="zone-frow" style="margin-bottom:6px"></div>
  <div class="frow">
    <button class="fbtn act" data-f="all" onclick="setF('all',this)">الكل</button>
    <button class="fbtn"     data-f="yes" onclick="setF('yes',this)">✅ مجدول</button>
    <button class="fbtn"     data-f="no"  onclick="setF('no',this)">❌ غير مجدول</button>
  </div>
  <div class="cnt" id="cnt"></div>
  <table class="rtbl">
    <thead><tr><th>ID</th><th>الاسم</th><th>المنطقة</th><th>آخر شيفت</th><th>الهاتف</th><th>الحالة</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="rider-cards" id="rcards"></div>
</div>
<div id="toast">✅ تم النسخ</div>

</div>

<script>
const GH = 'https://cdn.jsdelivr.net/gh/ahmedsoker-sketch/3pls-Dashboard@main';
const CONFIG = {
  riderDataUrls: {
    today:    GH + '/rider-data-today.csv',
    tomorrow: GH + '/rider-data-tomorrow.csv',
    day2:     GH + '/rider-data-day2.csv',
  },
  datesUrl:       GH + '/rider-data-dates.json',
  targetsDataUrl: GH + '/targets-data.json',
  offices: {
    'Al Alamia':             'ala815',
    'Apache':                'apc739',
    'Barg':                  'brg293',
    'BeCool':                'bcl647',
    'Ebad El rahman':        'ebr361',
    'El Abtal':              'ebt529',
    'El Ezz':                'ezz174',
    'El Tohami':             'eth836',
    'el Dawlya':             'edw843',
    'Full Speed':            'fsp492',
    'Jasson':                'jsn758',
    'MR Delivery':           'mrd624',
    'MTA':                   'mta263',
    'Noot':                  'noo951',
    'Ready':                 'rdy472',
    'Speedo':                'spd941',
    'Stop Car':              'stp387',
    'Super Speed':           'ssp716',
    'Tanta':                 'tnt284',
    'Tanta Car':             'tnc563',
    'Team mh for Delivery':  'tmh625',
    'Top delivery':          'top519',
  }
};

var _riders = [], _flt = 'all', _off = '', _targets = {}, _zone = '', _prevSnap = null;
var _activeDay = 'today', _ridersByDay = {}, _dayDates = {};

window.onload = function () {
  var names = Object.keys(CONFIG.offices);
  var el = document.getElementById('olist');
  el.innerHTML = names.map(function(n){
    return '<button class="oopt" onclick="selOff(\'' + n.replace(/\\/g,'\\\\').replace(/'/g,"\\'") + '\')">' + n + '</button>';
  }).join('');

  try {
    var saved = localStorage.getItem('dash_office');
    if (saved && CONFIG.offices[saved]) { _off = saved; loadAndShowApp(); startAutoRefresh(); }
  } catch(e) {}
};

function selOff(n) {
  _off = n;
  document.getElementById('selname').textContent = '🏢 ' + n;
  document.getElementById('office-step').style.display = 'none';
  document.getElementById('pass-step').style.display   = 'block';
  document.getElementById('pinp').value  = '';
  document.getElementById('errmsg').textContent = '';
  setTimeout(function(){ document.getElementById('pinp').focus(); }, 80);
}

function resetOff() {
  _off = '';
  document.getElementById('office-step').style.display = 'block';
  document.getElementById('pass-step').style.display   = 'none';
  document.getElementById('pinp').value  = '';
  document.getElementById('errmsg').textContent = '';
}

function doLogin() {
  var p   = document.getElementById('pinp').value.trim();
  var err = document.getElementById('errmsg');
  err.textContent = '';
  if (!p) { err.textContent = 'أدخل الباسورد'; return; }
  if (CONFIG.offices[_off] !== p) {
    err.textContent = '❌ باسورد غلط';
    document.getElementById('pinp').value = '';
    document.getElementById('pinp').focus();
    return;
  }
  try { localStorage.setItem('dash_office', _off); } catch(e) {}
  loadAndShowApp();
  startAutoRefresh();
}

function loadAndShowApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display   = 'block';
  document.getElementById('aoff').textContent = _off;
  document.getElementById('aupd').textContent = '';
  document.getElementById('sgrid').innerHTML  = '';
  document.getElementById('day-tabs').innerHTML = '';
  document.getElementById('tbody').innerHTML  =
    '<tr><td colspan="6" class="ldg">⏳ جاري تحميل البيانات...</td></tr>';

  // No cache-buster — jsDelivr caches by query string so Date.now() defeats the CDN.
  // We purge jsDelivr after every push instead, so no buster needed here.
  function fetchWithTimeout(url, asJson, timeoutMs) {
    timeoutMs = timeoutMs || 15000;
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); }, timeoutMs);
    var p = fetch(url, { signal: ctrl.signal }).then(function(r){
      clearTimeout(timer);
      return asJson ? r.json() : r.text();
    }).catch(function(e){
      clearTimeout(timer);
      return asJson ? null : '';
    });
    return p;
  }
  var dayKeys = ['today', 'tomorrow', 'day2'];
  Promise.all([
    fetchWithTimeout(CONFIG.riderDataUrls.today,    false),
    fetchWithTimeout(CONFIG.riderDataUrls.tomorrow, false),
    fetchWithTimeout(CONFIG.riderDataUrls.day2,     false),
    fetchWithTimeout(CONFIG.targetsDataUrl,         true),
    fetchWithTimeout(CONFIG.datesUrl,               true)
  ]).then(function(results){
    var csvToday = results[0], csvTomorrow = results[1], csvDay2 = results[2];
    var tData = results[3], datesData = results[4];

    // Store date strings from metadata
    _dayDates = datesData
      ? { today: datesData.today||'', tomorrow: datesData.tomorrow||'', day2: datesData.day2||'' }
      : { today: '', tomorrow: '', day2: '' };

    // Show last push time from extension
    if (datesData && datesData.pushedAt) {
      document.getElementById('aupd').textContent = 'آخر رفع من التول: ' + datesData.pushedAt;
    }

    // Parse targets
    _targets = {};
    if (tData && tData.targets) {
      tData.targets.forEach(function(t){
        _targets[(t.zone||'') + '|||' + (t.office||'')] = { target: t.target||0, scheduled: t.scheduled||0 };
      });
    }

    // Parse riders for each day
    var offLower = _off.toLowerCase();
    function parseDay(csv) {
      var rows = parseCSV(csv);
      return rows
        .filter(function(r){ return (r['Office']||'').trim().toLowerCase() === offLower; })
        .map(function(r){ return {
          id:        (r['Rider ID']   || '').trim(),
          name:      (r['Name']       || '').trim(),
          zone:      (r['Zone']       || '').trim(),
          phone:     (r['Phone']      || '').trim(),
          lastShift: (r['Last Shift'] || '').trim(),
          scheduled: (r['Scheduled']  || '').trim().toLowerCase() === 'yes',
          ts:        (r['Timestamp']  || '').trim()
        }; });
    }
    _ridersByDay = {
      today:    parseDay(csvToday),
      tomorrow: parseDay(csvTomorrow),
      day2:     parseDay(csvDay2)
    };

    // Use last timestamp from today for the header
    var lastTs = '';
    _ridersByDay.today.forEach(function(r){ if (r.ts > lastTs) lastTs = r.ts; });
    document.getElementById('aupd').textContent = lastTs ? 'آخر تحديث: ' + lastTs : '';

    // Render day tabs then load active day
    renderDayTabs();
    loadActiveDay();
  }).catch(function(e){
    document.getElementById('aupd').textContent = '❌ خطأ في تحميل البيانات';
    document.getElementById('tbody').innerHTML =
      '<tr><td colspan="6" class="nor">❌ ' + e.message + '</td></tr>';
  });
}

function renderDayTabs() {
  var labels   = { today: 'النهارده', tomorrow: 'بكرة', day2: 'بعده' };
  var dayNames = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  var dayKeys  = ['today','tomorrow','day2'];
  var html = dayKeys.map(function(k){
    var dateStr  = _dayDates[k];
    var dayLabel = '';
    if (dateStr) {
      var dt = new Date(dateStr + 'T12:00:00Z');
      dayLabel = dayNames[dt.getUTCDay()];
    }
    var act = k === _activeDay ? ' act' : '';
    return '<button class="day-tab'+act+'" onclick="setActiveDay(\''+k+'\')">' +
      labels[k] + (dayLabel ? '<span class="day-lbl">'+dayLabel+'</span>' : '') +
      '</button>';
  }).join('');
  document.getElementById('day-tabs').innerHTML = html;
}

function setActiveDay(day) {
  _activeDay = day;
  renderDayTabs();
  loadActiveDay();
}

function loadActiveDay() {
  _riders = _ridersByDay[_activeDay] || [];
  var zones = [];
  _riders.forEach(function(r){ if (r.zone && zones.indexOf(r.zone) === -1) zones.push(r.zone); });
  zones.sort(); _zone = '';
  var zf = document.getElementById('zone-frow');
  zf.innerHTML = '<button class="fbtn act" onclick="setZ(\'\',this)">كل الزونات</button>' +
    zones.map(function(z){
      return '<button class="fbtn" onclick="setZ(\'' + z.replace(/'/g,"\\'") + '\',this)">' + z + '</button>';
    }).join('');
  renderSum(); renderTbl();
}

var _autoRefreshTimer = null;
function reloadData() { if (_off) loadAndShowApp(); }
function startAutoRefresh() {
  if (_autoRefreshTimer) clearInterval(_autoRefreshTimer);
  _autoRefreshTimer = setInterval(function(){ if (_off) loadAndShowApp(); }, 30 * 60 * 1000);
}

function doLogout() {
  try { localStorage.removeItem('dash_office'); } catch(e) {}
  document.getElementById('login').style.display = 'block';
  document.getElementById('app').style.display   = 'none';
  _riders = []; _flt = 'all'; resetOff();
  document.querySelectorAll('.fbtn').forEach(function(b){
    b.classList.toggle('act', b.dataset.f === 'all');
  });
}

function renderSum() {
  // Build zones from riders
  var riderZones = {};
  _riders.forEach(function(r){
    if (!r.zone) return;
    if (!riderZones[r.zone]) riderZones[r.zone] = { s:0, t:0 };
    riderZones[r.zone].t++;
    if (r.scheduled) riderZones[r.zone].s++;
  });

  var hasTargets = Object.keys(_targets).length > 0;

  // Build full zone list — from riders + targets (so بكرة/بعده still show zones)
  var zoneSet = {};
  Object.keys(riderZones).forEach(function(z){ zoneSet[z] = true; });
  if (hasTargets) {
    Object.keys(_targets).forEach(function(k){
      var parts = k.split('|||');
      if (parts[1] && parts[1].toLowerCase() === _off.toLowerCase()) zoneSet[parts[0]] = true;
    });
  }

  var totalSched = 0, totalTarget = 0, h = '';
  var snapKey = 'dash_snap_' + _off + '_' + _activeDay;
  var prevSnap = {};
  try { var sv = localStorage.getItem(snapKey); if (sv) prevSnap = JSON.parse(sv); } catch(e) {}
  var currSnap = {};

  Object.keys(zoneSet).sort().forEach(function(z){
    var key   = z + '|||' + _off;
    var tData = hasTargets ? _targets[key] : null;
    var sched  = (_activeDay === 'today' && tData) ? tData.scheduled : (riderZones[z] ? riderZones[z].s : 0);
    var target = tData ? tData.target    : (riderZones[z] ? riderZones[z].t : 0);
    var delta  = prevSnap[z] !== undefined ? sched - prevSnap[z] : null;
    currSnap[z] = sched;
    totalSched  += sched;
    totalTarget += target;
    h += sc(z, sched, target, target > 0 ? sched/target : null, delta, true);
  });

  try { localStorage.setItem(snapKey, JSON.stringify(currSnap)); } catch(e) {}

  document.getElementById('sgrid').innerHTML =
    sc('الإجمالي', totalSched, totalTarget, totalTarget > 0 ? totalSched/totalTarget : null, null, false) + h;
}

function sc(l, s, t, p, delta, clickable) {
  var ps = '', pt = '—', dh = '';
  if (p !== null) {
    pt = Math.round(p * 100) + '%';
    if      (p >= .85) ps = 'background:var(--success-bg);color:var(--success-text)';
    else if (p >= .65) ps = 'background:var(--warn-bg);color:var(--warn-text)';
    else               ps = 'background:var(--danger-bg);color:var(--danger-text)';
  }
  if (delta !== null && delta !== undefined && delta !== 0) {
    dh = delta > 0
      ? '<sup class="delta-up">↑'+delta+'</sup>'
      : '<sup class="delta-down">↓'+Math.abs(delta)+'</sup>';
  }
  var sid = l.replace(/[^a-zA-Z0-9]/g,'_');
  var cls = 'scard' + (clickable ? '' : ' scard-tot');
  var oc  = clickable ? ' id="szc_'+sid+'" onclick="filterZone(\''+l.replace(/'/g,"\\'")+'\')"' : '';
  var arr = clickable ? '<span class="sarrow">▼</span>' : '';
  // scheduled = colored by status, target = muted
  var schedColor = p === null ? 'var(--text)' : (p >= .85 ? 'var(--success-text)' : p >= .65 ? 'var(--warn-text)' : 'var(--danger-text)');
  return '<div class="'+cls+'"'+oc+'>' +
    '<div class="szone">'+l+'</div>' +
    '<div class="snum"><span style="color:'+schedColor+';font-weight:700">'+s+dh+'</span><span style="color:var(--muted);font-size:13px;font-weight:400"> / '+t+'</span></div>' +
    '<span class="spct" style="'+ps+'">'+pt+'</span>'+arr+'</div>';
}

function filterZone(z) {
  if (_zone === z) {
    setZ('', document.querySelector('#zone-frow .fbtn'));
  } else {
    var btn = null;
    document.querySelectorAll('#zone-frow .fbtn').forEach(function(b){ if (b.textContent.trim() === z) btn = b; });
    setZ(z, btn);
  }
}

function setF(f, b) {
  _flt = f;
  document.querySelectorAll('#app .frow:last-of-type .fbtn').forEach(function(x){ x.classList.toggle('act', x === b); });
  renderTbl();
}

function setZ(z, b) {
  _zone = z;
  document.querySelectorAll('#zone-frow .fbtn').forEach(function(x){ x.classList.toggle('act', x === b); });
  // Sync scard active state
  document.querySelectorAll('.scard[id^="szc_"]').forEach(function(c){
    c.classList.toggle('zact', z && c.id === 'szc_' + z.replace(/[^a-zA-Z0-9]/g,'_'));
  });
  renderTbl();
}

function renderTbl() {
  var q    = (document.getElementById('srch').value || '').toLowerCase();
  var rows = _riders;
  if (_zone)          rows = rows.filter(function(r){ return r.zone === _zone; });
  if (_flt === 'yes') rows = rows.filter(function(r){ return  r.scheduled; });
  if (_flt === 'no')  rows = rows.filter(function(r){ return !r.scheduled; });
  if (q) rows = rows.filter(function(r){
    return (r.name||'').toLowerCase().includes(q) ||
           (r.id||'').includes(q) ||
           (r.zone||'').toLowerCase().includes(q);
  });
  document.getElementById('cnt').textContent = rows.length + ' طيار';
  var tb = document.getElementById('tbody');
  if (!rows.length) { tb.innerHTML = '<tr><td colspan="6" class="nor">📭 مفيش نتايج</td></tr>'; return; }
  rows = rows.slice().sort(function(a,b){
    var zc = (a.zone||'').localeCompare(b.zone||'');
    if (zc !== 0) return zc;
    if (b.lastShift && a.lastShift) return b.lastShift.localeCompare(a.lastShift);
    if (b.lastShift) return 1;
    if (a.lastShift) return -1;
    return 0;
  });
  tb.innerHTML = rows.map(function(r){
    var badge = r.scheduled
      ? '<span class="bdg by">✅ مجدول</span>'
      : '<span class="bdg bn">❌ غير مجدول</span>';
    var ph = r.phone
      ? '<span class="ph-copy" onclick="copyPhone(\'' + r.phone + '\')">' + r.phone + ' 📋</span>'
      : '—';
    return '<tr><td>' + (r.id||'—') + '</td>' +
      '<td style="font-weight:500">' + (r.name||'—') + '</td>' +
      '<td>' + (r.zone||'—') + '</td>' +
      '<td style="font-size:11px;color:var(--muted)">' + (r.lastShift||'—') + '</td>' +
      '<td>' + ph + '</td><td>' + badge + '</td></tr>';
  }).join('');
  document.getElementById('rcards').innerHTML = rows.map(function(r){
    var badge = r.scheduled
      ? '<span class="bdg by">✅ مجدول</span>'
      : '<span class="bdg bn">❌ غير مجدول</span>';
    var ph = r.phone
      ? '<span class="ph-copy" onclick="copyPhone(\'' + r.phone + '\')">' + r.phone + ' 📋</span>'
      : '';
    return '<div class="rcard"><div class="rcard-top"><div>' +
      '<div class="rcard-name">' + (r.name||'—') + '</div>' +
      '<div class="rcard-id">' + (r.id||'') + '</div></div>' + badge + '</div>' +
      '<div class="rcard-meta">' +
        (r.zone      ? '<span>📍 ' + r.zone + '</span>' : '') +
        (r.lastShift ? '<span>🗓 ' + r.lastShift + '</span>' : '') +
        (ph          ? '<span>' + ph + '</span>' : '') +
      '</div></div>';
  }).join('');
}

function copyPhone(phone) {
  navigator.clipboard.writeText(phone).then(function(){
    var t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }).catch(function(){});
}

function parseCSV(text) {
  if (!text || !text.trim()) return [];
  var lines = text.split(/\r?\n/).filter(function(l){ return l.trim(); });
  if (lines.length < 2) return [];
  function pl(line) {
    var res=[], cur='', inQ=false;
    for (var i=0;i<line.length;i++) {
      var c=line[i];
      if (c==='"') { if (inQ && line[i+1]==='"') { cur+='"'; i++; } else inQ=!inQ; }
      else if (c===',' && !inQ) { res.push(cur.trim()); cur=''; }
      else cur+=c;
    }
    res.push(cur.trim()); return res;
  }
  var headers = pl(lines[0]).map(function(h){ return h.replace(/^"|"$/g,''); });
  return lines.slice(1).map(function(line){
    var vals=pl(line), row={};
    headers.forEach(function(h,i){ row[h]=(vals[i]||'').replace(/^"|"$/g,''); });
    return row;
  });
}
