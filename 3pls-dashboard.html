<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mohandiseen 3PLs-Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#FF5900;--hdr:#411517;--bg:#F4EDE3;--surf:#fff;
  --bdr:#e8ddd3;--bdr2:#d4c4b4;--text:#1a0f0a;--text2:#5a3f35;
  --muted:#9a8a82;--sh:0 2px 8px rgba(65,21,23,.1);--radius:10px;
  --success-bg:#edf7ed;--success-text:#2d7a2d;
  --warn-bg:#fff8e6;   --warn-text:#b07800;
  --danger-bg:#fef0f0; --danger-text:#c0392b;
}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px}

/* ── Header ── */
.hdr{background:var(--hdr);padding:12px 20px;display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#F4EDE3;font-size:14px;transform:rotate(-4deg);flex-shrink:0;font-family:'Poppins',sans-serif}
.hdr-wrap{display:flex;flex-direction:column}
.hdr-t{color:#fff;font-size:14px;font-weight:700}
.hdr-s{font-size:10px;color:rgba(244,237,227,.5);margin-top:1px}
.acc{height:3px;background:linear-gradient(90deg,var(--accent),#ff8c42,transparent)}

.wrap{max-width:720px;margin:0 auto;padding:16px}

/* ── Login Card ── */
.lcard{background:var(--surf);border-radius:12px;border:1px solid var(--bdr);box-shadow:var(--sh);padding:28px 24px;max-width:400px;margin:28px auto}
.lci{font-size:36px;text-align:center;margin-bottom:10px}
.lct{font-size:17px;font-weight:700;text-align:center;margin-bottom:3px}
.lcs{font-size:12px;color:var(--text2);text-align:center;margin-bottom:20px}
.slbl{font-size:11px;font-weight:600;color:var(--text2);display:block;margin-bottom:6px}
.olist{display:flex;flex-direction:column;gap:5px;max-height:220px;overflow-y:auto}
.oopt{padding:9px 14px;border:2px solid var(--bdr);border-radius:8px;cursor:pointer;font-family:'Poppins',sans-serif;font-size:13px;font-weight:500;background:var(--bg);color:var(--text);text-align:right;transition:all .15s;width:100%}
.oopt:hover{border-color:var(--accent);background:#fff7f4;color:var(--accent)}
#pass-step{display:none;margin-top:14px}
.selbdg{background:#fff7f4;border:1px solid var(--accent);border-radius:7px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.chgbtn{font-size:11px;color:var(--muted);background:none;border:none;cursor:pointer;font-family:'Poppins',sans-serif;padding:0}
.chgbtn:hover{color:var(--accent)}
.pinp{width:100%;padding:10px 14px;border:2px solid var(--bdr);border-radius:8px;font-size:18px;font-family:'Poppins',sans-serif;text-align:center;background:var(--bg);color:var(--text);outline:none;letter-spacing:4px;margin-bottom:12px}
.pinp:focus{border-color:var(--accent)}
.lbtn{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-family:'Poppins',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s;letter-spacing:.01em}
.lbtn:hover{opacity:.88}
.lbtn:disabled{opacity:.5;cursor:not-allowed}
.errmsg{color:var(--danger-text);font-size:12px;margin-top:8px;text-align:center;min-height:16px}

/* ── App ── */
#app{display:none}
.ohdr{background:var(--hdr);border-radius:var(--radius);padding:14px 16px;color:#fff;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.oname{font-size:16px;font-weight:700}
.oupd{font-size:11px;opacity:.65;margin-top:2px}
.ohdr-btns{display:flex;gap:8px;align-items:center}
.logbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:7px;padding:5px 14px;font-family:'Poppins',sans-serif;font-size:12px;cursor:pointer;transition:opacity .15s}
.logbtn:hover{opacity:.8}
.reloadbtn{background:rgba(255,89,0,.25);border:1px solid rgba(255,89,0,.5);color:#ffb090;border-radius:7px;padding:5px 12px;font-family:'Poppins',sans-serif;font-size:12px;cursor:pointer;transition:all .15s}
.reloadbtn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Summary grid */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:16px}
.scard{background:var(--surf);border:1px solid var(--bdr);border-radius:8px;padding:12px;text-align:center;box-shadow:var(--sh)}
.szone{font-size:10px;font-weight:600;color:var(--text2);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snum{font-size:18px;font-weight:700;margin-bottom:3px}
.spct{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600}

/* Riders table */
.stit{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.frow{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.fbtn{padding:4px 14px;border:1px solid var(--bdr);border-radius:20px;font-family:'Poppins',sans-serif;font-size:11px;font-weight:500;background:var(--surf);color:var(--text);cursor:pointer;transition:all .15s}
.fbtn:hover{border-color:var(--accent);color:var(--accent)}
.fbtn.act{background:var(--accent);color:#fff;border-color:var(--accent)}
.sinp{width:100%;padding:8px 12px;border:1px solid var(--bdr);border-radius:7px;font-family:'Poppins',sans-serif;font-size:12px;background:var(--bg);color:var(--text);outline:none;margin-bottom:10px}
.sinp:focus{border-color:var(--accent)}
.cnt{font-size:11px;color:var(--muted);margin-bottom:6px}
.rtbl{width:100%;border-collapse:collapse;background:var(--surf);border-radius:var(--radius);overflow:hidden;box-shadow:var(--sh);border:1px solid var(--bdr)}
.rtbl th{padding:8px 12px;font-size:10px;font-weight:600;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--bdr);text-align:right;letter-spacing:.04em;text-transform:uppercase}
.rtbl td{padding:8px 12px;font-size:12px;border-top:1px solid var(--bdr);text-align:right}
.rtbl tr:hover td{background:rgba(255,89,0,.03)}
.bdg{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600}
.by{background:var(--success-bg);color:var(--success-text)}
.bn{background:var(--danger-bg);color:var(--danger-text)}
.nor{text-align:center;padding:20px;color:var(--muted);font-size:12px}
.ldg{text-align:center;padding:24px;color:var(--muted);font-size:12px}

/* Config warning */
.cfg-warn{background:#fff8e6;border:1px solid #f0c060;border-radius:8px;padding:12px 16px;margin-bottom:14px;font-size:12px;color:#7a5800;line-height:1.6}
.cfg-warn code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:4px;font-size:11px}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">t</div>
  <div class="hdr-wrap">
    <div class="hdr-t">Mohandiseen 3PLs-Dashboard</div>
    <div class="hdr-s">Rider Coverage Tracker</div>
  </div>
</div>
<div class="acc"></div>
<div class="wrap">

<!-- Login -->
<div id="login">
  <div id="cfg-warn-box"></div>
  <div class="lcard">
    <div class="lci">🏢</div>
    <div class="lct">تسجيل الدخول</div>
    <div class="lcs">اختار مكتبك ثم أدخل الباسورد</div>
    <div id="office-step">
      <span class="slbl">① اختار المكتب</span>
      <div class="olist" id="olist"></div>
    </div>
    <div id="pass-step">
      <div class="selbdg">
        <span id="selname"></span>
        <button class="chgbtn" onclick="resetOff()">← تغيير</button>
      </div>
      <span class="slbl">② أدخل الباسورد</span>
      <input class="pinp" type="password" id="pinp" placeholder="••••••" autocomplete="off"
             onkeydown="if(event.key==='Enter')doLogin()">
      <button class="lbtn" id="lbtn" onclick="doLogin()">دخول</button>
      <div class="errmsg" id="errmsg"></div>
    </div>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="ohdr">
    <div>
      <div class="oname" id="aoff"></div>
      <div class="oupd" id="aupd"></div>
    </div>
    <div class="ohdr-btns">
      <button class="reloadbtn" onclick="reloadData()">🔄 تحديث</button>
      <button class="logbtn" onclick="doLogout()">← خروج</button>
    </div>
  </div>
  <div class="sgrid" id="sgrid"></div>
  <div class="stit">👥 قائمة الطيارين</div>
  <input class="sinp" type="text" id="srch" placeholder="🔍 ابحث بالاسم أو الـ ID أو المنطقة..." oninput="renderTbl()">
  <div class="frow">
    <button class="fbtn act" data-f="all" onclick="setF('all',this)">الكل</button>
    <button class="fbtn"     data-f="yes" onclick="setF('yes',this)">✅ مجدول</button>
    <button class="fbtn"     data-f="no"  onclick="setF('no',this)">❌ غير مجدول</button>
  </div>
  <div class="cnt" id="cnt"></div>
  <table class="rtbl">
    <thead><tr><th>ID</th><th>الاسم</th><th>المنطقة</th><th>آخر شيفت</th><th>الهاتف</th><th>الحالة</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

</div><!-- /wrap -->

<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║  ⚙️  CONFIG — Ahmed only needs to edit this section         ║
// ╠══════════════════════════════════════════════════════════════╣
// ║  riderDataUrl:                                               ║
// ║    1. Open the Google Sheet                                  ║
// ║    2. File → Share → Publish to web                         ║
// ║    3. Change "Entire Document" to "Rider Data" tab           ║
// ║    4. Change "Web page" to "Comma-separated values (.csv)"   ║
// ║    5. Click Publish → copy the URL → paste below             ║
// ║                                                              ║
// ║  offices:                                                    ║
// ║    Key   = office name EXACTLY as in HeadCount sheet         ║
// ║    Value = password for that office                          ║
// ╚══════════════════════════════════════════════════════════════╝

const CONFIG = {
  riderDataUrl: 'https://raw.githubusercontent.com/ahmedsoker-sketch/3pls-Dashboard/main/rider-data.csv',

  offices: {
    'Al Alamia':             'ala815',
    'Apache':                'apc739',
    'Barg':                  'brg293',
    'BeCool':                'bcl647',
    'Ebad El rahman':        'ebr361',
    'El Abtal':              'ebt529',
    'El Ezz':                'ezz174',
    'El Tohami':             'eth836',
    'el Dawlya':             'edw843',
    'Full Speed':            'fsp492',
    'Jasson':                'jsn758',
    'MR Delivery':           'mrd624',
    'MTA':                   'mta263',
    'Noot':                  'noo951',
    'Ready':                 'rdy472',
    'Speedo':                'spd941',
    'Stop Car':              'stp387',
    'Super Speed':           'ssp716',
    'Tanta':                 'tnt284',
    'Tanta Car':             'tnc563',
    'Team mh for Delivery':  'tmh625',
    'Top delivery':          'top519',
  }
};

// ═══════════════════════════════════════════════════════════════
// App logic — no need to edit below this line
// ═══════════════════════════════════════════════════════════════

let _riders = [], _flt = 'all', _off = '';

window.onload = function () {
  // Show config warning if not set up
  if (CONFIG.riderDataUrl === 'PASTE_CSV_URL_HERE') {
    document.getElementById('cfg-warn-box').innerHTML =
      '<div class="cfg-warn">⚠️ <b>لازم تحط الـ CSV URL في CONFIG</b><br>' +
      'افتح الملف ده في text editor وحط الـ URL في <code>riderDataUrl</code></div>';
  }

  const names = Object.keys(CONFIG.offices);
  const el = document.getElementById('olist');
  if (!names.length) {
    el.innerHTML = '<div style="color:var(--danger-text);font-size:12px;text-align:center;padding:10px">⚠️ مفيش مكاتب في CONFIG</div>';
    return;
  }
  el.innerHTML = names.map(n =>
    '<button class="oopt" onclick="selOff(\'' + n.replace(/\\/g,'\\\\').replace(/'/g,"\\'") + '\')">' + n + '</button>'
  ).join('');

  // Auto-login if office was saved before
  try {
    var saved = localStorage.getItem('dash_office');
    if (saved && CONFIG.offices[saved]) {
      _off = saved;
      loadAndShowApp();
    }
  } catch(e) {}
};

function selOff(n) {
  _off = n;
  document.getElementById('selname').textContent = '🏢 ' + n;
  document.getElementById('office-step').style.display = 'none';
  document.getElementById('pass-step').style.display   = 'block';
  document.getElementById('pinp').value  = '';
  document.getElementById('errmsg').textContent = '';
  setTimeout(function(){ document.getElementById('pinp').focus(); }, 80);
}

function resetOff() {
  _off = '';
  document.getElementById('office-step').style.display = 'block';
  document.getElementById('pass-step').style.display   = 'none';
  document.getElementById('pinp').value  = '';
  document.getElementById('errmsg').textContent = '';
}

function doLogin() {
  var p   = document.getElementById('pinp').value.trim();
  var err = document.getElementById('errmsg');
  err.textContent = '';
  if (!p) { err.textContent = 'أدخل الباسورد'; return; }

  if (CONFIG.offices[_off] !== p) {
    err.textContent = '❌ باسورد غلط';
    document.getElementById('pinp').value = '';
    document.getElementById('pinp').focus();
    return;
  }

  // Save to localStorage so next visit auto-logs in
  try { localStorage.setItem('dash_office', _off); } catch(e) {}
  loadAndShowApp();
}

function loadAndShowApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display   = 'block';
  document.getElementById('aoff').textContent = _off;
  document.getElementById('aupd').textContent = '';
  document.getElementById('sgrid').innerHTML  = '';
  document.getElementById('tbody').innerHTML  =
    '<tr><td colspan="6" class="ldg">⏳ جاري تحميل البيانات...</td></tr>';

  if (CONFIG.riderDataUrl === 'PASTE_CSV_URL_HERE') {
    document.getElementById('aupd').textContent = '⚠️ riderDataUrl مش محدود في CONFIG';
    document.getElementById('tbody').innerHTML =
      '<tr><td colspan="6" class="nor">حط الـ CSV URL الأول</td></tr>';
    return;
  }

  var url = CONFIG.riderDataUrl + '?_t=' + Date.now();

  fetch(url)
    .then(function(r){ return r.text(); })
    .then(function(csv){
      var rows = parseCSV(csv);
      var offLower = _off.toLowerCase();
      _riders = rows
        .filter(function(r){ return (r['Office']||'').trim().toLowerCase() === offLower; })
        .map(function(r){ return {
          id:        (r['Rider ID']   || '').trim(),
          name:      (r['Name']       || '').trim(),
          zone:      (r['Zone']       || '').trim(),
          phone:     (r['Phone']      || '').trim(),
          lastShift: (r['Last Shift'] || '').trim(),
          scheduled: (r['Scheduled']  || '').trim().toLowerCase() === 'yes',
          ts:        (r['Timestamp']  || '').trim()
        }; });

      var lastTs = '';
      _riders.forEach(function(r){ if (r.ts > lastTs) lastTs = r.ts; });
      document.getElementById('aupd').textContent = lastTs ? 'آخر تحديث: ' + lastTs : '';

      renderSum();
      renderTbl();
    })
    .catch(function(e){
      document.getElementById('aupd').textContent = '❌ خطأ في تحميل البيانات';
      document.getElementById('tbody').innerHTML =
        '<tr><td colspan="6" class="nor">❌ ' + e.message + '</td></tr>';
    });
}

function reloadData() {
  if (!_off) return;
  loadAndShowApp();
}

function doLogout() {
  try { localStorage.removeItem('dash_office'); } catch(e) {}
  document.getElementById('login').style.display = 'block';
  document.getElementById('app').style.display   = 'none';
  _riders = []; _flt = 'all'; resetOff();
  document.querySelectorAll('.fbtn').forEach(function(b){
    b.classList.toggle('act', b.dataset.f === 'all');
  });
}

function renderSum() {
  var zones = {};
  _riders.forEach(function(r){
    if (!zones[r.zone]) zones[r.zone] = { s:0, t:0 };
    zones[r.zone].t++;
    if (r.scheduled) zones[r.zone].s++;
  });
  var ts = _riders.filter(function(r){ return r.scheduled; }).length;
  var tt = _riders.length;
  var h  = sc('الإجمالي', ts, tt, tt ? ts/tt : null);
  Object.keys(zones).sort().forEach(function(z){
    var x = zones[z];
    h += sc(z, x.s, x.t, x.t ? x.s/x.t : null);
  });
  document.getElementById('sgrid').innerHTML = h;
}

function sc(l, s, t, p) {
  var ps = '', pt = '—';
  if (p !== null) {
    pt = Math.round(p * 100) + '%';
    if      (p >= .85) ps = 'background:var(--success-bg);color:var(--success-text)';
    else if (p >= .65) ps = 'background:var(--warn-bg);color:var(--warn-text)';
    else               ps = 'background:var(--danger-bg);color:var(--danger-text)';
  }
  return '<div class="scard">' +
    '<div class="szone">' + l + '</div>' +
    '<div class="snum">' + s + ' / ' + t + '</div>' +
    '<span class="spct" style="' + ps + '">' + pt + '</span></div>';
}

function setF(f, b) {
  _flt = f;
  document.querySelectorAll('.fbtn').forEach(function(x){ x.classList.toggle('act', x === b); });
  renderTbl();
}

function renderTbl() {
  var q    = (document.getElementById('srch').value || '').toLowerCase();
  var rows = _riders;
  if (_flt === 'yes') rows = rows.filter(function(r){ return  r.scheduled; });
  if (_flt === 'no')  rows = rows.filter(function(r){ return !r.scheduled; });
  if (q) rows = rows.filter(function(r){
    return (r.name||'').toLowerCase().includes(q) ||
           (r.id||'').includes(q) ||
           (r.zone||'').toLowerCase().includes(q);
  });
  document.getElementById('cnt').textContent = rows.length + ' طيار';
  var tb = document.getElementById('tbody');
  if (!rows.length) {
    tb.innerHTML = '<tr><td colspan="6" class="nor">📭 مفيش نتايج</td></tr>';
    return;
  }
  // Sort: by zone ASC, then lastShift DESC (most recent first)
  rows = rows.slice().sort(function(a,b){
    var zc = (a.zone||'').localeCompare(b.zone||'');
    if (zc !== 0) return zc;
    if (b.lastShift && a.lastShift) return b.lastShift.localeCompare(a.lastShift);
    if (b.lastShift) return 1;
    if (a.lastShift) return -1;
    return 0;
  });
  tb.innerHTML = rows.map(function(r){
    var badge = r.scheduled
      ? '<span class="bdg by">✅ مجدول</span>'
      : '<span class="bdg bn">❌ غير مجدول</span>';
    var ph = r.phone
      ? '<a href="tel:' + r.phone + '" style="color:var(--accent);text-decoration:none">' + r.phone + '</a>'
      : '—';
    var ls = r.lastShift || '—';
    return '<tr>' +
      '<td>' + (r.id||'—') + '</td>' +
      '<td style="font-weight:500">' + (r.name||'—') + '</td>' +
      '<td>' + (r.zone||'—') + '</td>' +
      '<td style="font-size:11px;color:var(--text-secondary)">' + ls + '</td>' +
      '<td>' + ph + '</td>' +
      '<td>' + badge + '</td>' +
      '</tr>';
  }).join('');
}

// ── CSV Parser ──────────────────────────────────────────────────
function parseCSV(text) {
  if (!text || !text.trim()) return [];
  var lines = text.split(/\r?\n/).filter(function(l){ return l.trim(); });
  if (lines.length < 2) return [];
  function pl(line) {
    var res=[], cur='', inQ=false;
    for (var i=0;i<line.length;i++) {
      var c=line[i];
      if (c==='"') { if (inQ && line[i+1]==='"') { cur+='"'; i++; } else inQ=!inQ; }
      else if (c===',' && !inQ) { res.push(cur.trim()); cur=''; }
      else cur+=c;
    }
    res.push(cur.trim()); return res;
  }
  var headers = pl(lines[0]).map(function(h){ return h.replace(/^"|"$/g,''); });
  return lines.slice(1).map(function(line){
    var vals=pl(line), row={};
    headers.forEach(function(h,i){ row[h]=(vals[i]||'').replace(/^"|"$/g,''); });
    return row;
  });
}
</script>
</body>
</html>
